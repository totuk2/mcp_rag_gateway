# Google Flights via fli (https://github.com/punitarani/fli, PyPI `flights[mcp]`):
# reverse-engineered Google Flights, no API key. Our Dockerfile.gateway pins the
# version; `fli-mcp-http` serves Streamable HTTP on 0.0.0.0:8000/mcp.
id: google-flights
kind: docker
build: .
dockerfile: Dockerfile.gateway
port: 8000
transport: streamable_http
path: /mcp
description: "Google Flights search: prices and itineraries for a route and date, cheapest-date calendars, airport lookup."
categories: [flight-search]
# Large search results are rewritten into a short digest by the gateway (run_tool full=true for raw).
compact_results: true
